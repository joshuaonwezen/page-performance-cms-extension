sections:
  - key: ga4
    label: Google Analytics 4
    elements:
      - type: text
        key: propertyId
        label: Property ID
        help: >-
          The numeric GA4 property ID (GA4: Admin > Property details), not the G- measurement ID.
      - type: secret
        key: serviceAccountJson
        label: Service account key (JSON)
        help: >-
          A Google Cloud service account key with the Analytics Data API enabled. Add the
          service account's email as a Viewer on the property. Leave blank to keep the saved one.
      - type: button
        label: Save
        action: saveGa4
        style: primary
  - key: fx
    label: Feature Experimentation
    elements:
      - type: secret
        key: apiToken
        label: Personal access token
        help: >-
          In FX: Profile > API Access > Generate new token. Read access is enough: it lists
          the project's flags and reads experiment results. Leave blank to keep the saved one.
      - type: text
        key: sdkKey
        label: Site SDK key
        help: >-
          The SDK key your site decides with (FX: Settings > Environments). The project and
          environment are read from it, so the panel shows the experiments your visitors
          actually get.
      - type: button
        label: Save
        action: saveFx
        style: primary
